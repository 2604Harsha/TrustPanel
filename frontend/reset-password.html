
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustPanel | Reset Password</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body class="auth-page">

    <main class="auth-layout">
        <section class="auth-brand">
            <a href="index.html" class="brand">
                <span class="brand-icon">TP</span>
                TrustPanel
            </a>

            <div class="brand-content">
                <span class="eyebrow">SECURE YOUR ACCOUNT</span>
                <h1>A fresh start.<br>
                    <span>A stronger password.</span>
                </h1>
                <p>Choose a new password to secure your workspace.</p>
            </div>

            <div class="brand-footer">
                <span>© 2026 TrustPanel</span>
                <span>Secure. Simple. Yours.</span>
            </div>
        </section>

        <section class="auth-content">
            <div class="auth-container">

                <a href="index.html" class="back-link">← Back to login</a>

                <div class="form-heading">
                    <span class="eyebrow">RESET PASSWORD</span>
                    <h2>Create new password</h2>
                    <p>Enter your reset code and choose a new password.</p>
                </div>

                <form id="resetForm">

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="resetCode">Reset code</label>
                        <input
                            type="text"
                            id="resetCode"
                            placeholder="Enter code"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New password</label>
                        <input
                            type="password"
                            id="newPassword"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            minlength="8"
                            required
                        >
                    </div>

                    <button type="submit" class="primary-button">
                        Reset password →
                    </button>

                </form>

            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="./js/config.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/reset-password.js"></script>
</body>
</html>
